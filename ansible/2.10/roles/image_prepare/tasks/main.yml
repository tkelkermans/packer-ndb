---
- name: Normalize OS facts
  ansible.builtin.set_fact:
    ndb_os_family: "{{ ansible_facts['os_family'] }}"

- name: Check cloud-init availability
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: image_prepare_cloud_init

- name: Assert cloud-init is present for cloned image first boot
  ansible.builtin.assert:
    that:
      - image_prepare_cloud_init.stat.exists
    fail_msg: >-
      cloud-init is required in NDB gold images: validation and E2E VMs rely
      on first-boot cloud-init to re-create the provisioning user, and cloned
      first boots rely on it for instance reset. Refusing to capture an image
      without /usr/bin/cloud-init.

- name: Remove generated cloud-init netplan on Debian-family images
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  when: ndb_os_family == "Debian"
  become: yes

- name: Check subscription-manager availability
  ansible.builtin.shell:
    cmd: command -v subscription-manager
  register: image_prepare_subscription_manager
  changed_when: false
  failed_when: false
  when: ndb_os_family == "RedHat"

- name: Unregister RHEL subscription before image capture
  ansible.builtin.command:
    cmd: subscription-manager unregister
  register: image_prepare_rhel_unregister
  changed_when: false
  failed_when: false
  no_log: true
  become: yes
  when:
    - ndb_os_family == "RedHat"
    - rhel_subscription_enabled | default(false) | bool
    - image_prepare_subscription_manager.rc | default(1) == 0

- name: Clean RHEL subscription state before image capture
  ansible.builtin.command:
    cmd: subscription-manager clean
  changed_when: false
  failed_when: false
  no_log: true
  become: yes
  when:
    - ndb_os_family == "RedHat"
    - rhel_subscription_enabled | default(false) | bool
    - image_prepare_subscription_manager.rc | default(1) == 0

- name: Reset cloud-init state for cloned image first boot
  ansible.builtin.command:
    cmd: /usr/bin/cloud-init clean --logs --machine-id
  when: image_prepare_cloud_init.stat.exists
  changed_when: true
  become: yes

# Regeneration on first boot is guaranteed by ndb-ssh-hostkeys-ensure.service
# (installed by the common role) even when a clone retains cloud-init
# instance metadata and per-instance modules do not rerun.
- name: Remove baked SSH host keys before image capture
  ansible.builtin.shell:
    cmd: rm -f /etc/ssh/ssh_host_*
  changed_when: true
  become: yes

- name: Flush filesystem buffers before image capture
  ansible.builtin.command:
    cmd: sync
  changed_when: false
  become: yes

# Must remain the last task in the play: it deletes the SSH build user this
# connection authenticated as. The in-flight session survives, but any later
# become task would fail because sudo can no longer resolve the invoking user.
- name: Remove packer build user and access before image capture
  ansible.builtin.shell:
    cmd: |
      set -eu
      rm -f /etc/sudoers.d/90-cloud-init-users
      if getent passwd packer >/dev/null 2>&1; then
        rc=0
        userdel --force --remove packer || rc=$?
        case "$rc" in
          0|12) ;;
          *) exit "$rc" ;;
        esac
      fi
      rm -rf /home/packer
      if getent passwd packer >/dev/null 2>&1; then
        echo "ERROR: packer build user still present before image capture" >&2
        exit 1
      fi
      sync
  changed_when: true
  become: yes
