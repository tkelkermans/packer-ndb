---
# Base services (D-Bus, firewalld, chrony, cron), sudoers policy, NDB
# drive user, and first-boot SSH host key regeneration.
- name: Ensure Debian-family D-Bus socket wants directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sockets.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure Debian-family D-Bus service wants directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/basic.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure Debian-family D-Bus socket is pulled in during first boot
  ansible.builtin.file:
    src: /lib/systemd/system/dbus.socket
    dest: /etc/systemd/system/sockets.target.wants/dbus.socket
    state: link
    force: true
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure Debian-family D-Bus service is pulled in during first boot
  ansible.builtin.file:
    src: /lib/systemd/system/dbus.service
    dest: /etc/systemd/system/basic.target.wants/dbus.service
    state: link
    force: true
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure Debian-family D-Bus service is running
  ansible.builtin.systemd:
    name: dbus.service
    state: started
    daemon_reload: true
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure AppArmor disable directory exists (Ubuntu 24.04 workaround)
  ansible.builtin.file:
    path: /etc/apparmor.d/disable
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ndb_distribution == "Ubuntu" and ndb_distribution_version == "24.04"
  become: true

- name: Disable rsyslogd AppArmor profile for Ubuntu 24.04
  ansible.builtin.file:
    src: /etc/apparmor.d/usr.sbin.rsyslogd
    dest: /etc/apparmor.d/disable/usr.sbin.rsyslogd
    state: link
    force: true
  when: ndb_distribution == "Ubuntu" and ndb_distribution_version == "24.04"
  become: true

- name: Ensure firewalld service is enabled
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ndb_os_family in ["RedHat", "Debian"]
  become: true

- name: Check firewalld SSH service rule
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --query-service=ssh
  register: ndb_firewalld_ssh_rule
  changed_when: false
  failed_when: false
  when: ndb_os_family in ["RedHat", "Debian"]
  become: true

- name: Allow SSH through firewalld
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --add-service=ssh
  register: ndb_firewalld_allow_ssh
  changed_when: ndb_firewalld_allow_ssh.rc == 0
  when:
    - ndb_os_family in ["RedHat", "Debian"]
    - ndb_firewalld_ssh_rule.rc != 0
  become: true

- name: Reload firewalld after allowing SSH
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --reload
  changed_when: true
  when:
    - ndb_os_family in ["RedHat", "Debian"]
    - ndb_firewalld_allow_ssh is changed
  become: true

# firewalld declares Before=network-pre.target but, unlike Ubuntu's own
# ufw.service, keeps default dependencies - so it is also ordered
# After=basic.target -> sockets.target -> sysinit.target. Ubuntu's
# cloud-init.service is Before=sysinit.target and After=
# systemd-networkd-wait-online -> systemd-networkd -> network-pre.target,
# which closes an ordering cycle. systemd breaks a cycle by DELETING a job:
# when it picks cloud-init.service, the captured image boots with no
# provisioning user and no SSH keys. It is nondeterministic - the same image
# can boot correctly on another attempt - so the cycle must be removed, not
# worked around (2026-07-27 live regression; see docs/operational-lessons.md).
- name: Ensure firewalld drop-in directory exists (Debian family)
  ansible.builtin.file:
    path: /etc/systemd/system/firewalld.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ndb_os_family == "Debian"
  become: true

- name: Remove firewalld pre-network ordering to break the cloud-init cycle (Debian family)
  ansible.builtin.copy:
    dest: /etc/systemd/system/firewalld.service.d/10-ndb-cloud-init-ordering.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      # Reset the inherited Wants=/Before=network-pre.target ordering; keep the
      # shutdown ordering firewalld relies on. firewalld still starts on every
      # boot, in its normal multi-user slot.
      Wants=
      Before=
      Before=shutdown.target
  register: ndb_firewalld_ordering_dropin
  when: ndb_os_family == "Debian"
  become: true

- name: Reload systemd after firewalld ordering drop-in (Debian family)
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ndb_os_family == "Debian"
    - ndb_firewalld_ordering_dropin is changed
  become: true

- name: Ensure chrony service is enabled
  ansible.builtin.service:
    name: "{{ 'chronyd' if ndb_os_family == 'RedHat' else 'chrony' }}"
    state: started
    enabled: true
  become: true

- name: Expose Debian-family chrony config at NDB expected path
  ansible.builtin.file:
    src: /etc/chrony/chrony.conf
    dest: /etc/chrony.conf
    state: link
    force: true
  when: ndb_os_family == "Debian"
  become: true

- name: Ensure cron service is running
  ansible.builtin.service:
    name: "{{ 'crond' if ndb_os_family == 'RedHat' else 'cron' }}"
    state: started
    enabled: true
  become: true

- name: Ensure secure_path is present in /etc/sudoers
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "Defaults    secure_path = /sbin:/bin:/usr/sbin:/usr/bin"
    regexp: '^Defaults\s+secure_path\s*='
    validate: 'visudo -cf %s'
  become: true

- name: Disable requiretty in /etc/sudoers
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^Defaults    requiretty'
    state: absent
    validate: 'visudo -cf %s'
  become: true

- name: Ensure NDB drive user exists
  ansible.builtin.user:
    name: "{{ ndb_drive_user }}"
    shell: /bin/bash
    create_home: true
    state: present
  become: true

- name: Ensure /tmp has correct permissions (1777 with sticky bit)
  ansible.builtin.file:
    path: /tmp
    mode: '1777'
    state: directory
  become: true

- name: Configure NDB sudoers policy
  ansible.builtin.template:
    src: ndb_sudoers.j2
    dest: /etc/sudoers.d/ndb
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  when: configure_ndb_sudoers | bool
  become: true

# image_prepare deletes baked SSH host keys at capture. NDB clones can retain
# cloud-init instance metadata (per-instance key regeneration may not rerun),
# so key regeneration must not depend on cloud-init.
- name: Install SSH host key regeneration guard for cloned first boots
  ansible.builtin.copy:
    dest: /etc/systemd/system/ndb-ssh-hostkeys-ensure.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Regenerate missing SSH host keys before sshd starts
      Documentation=man:ssh-keygen(1)
      # Deliberately a NORMAL unit (default dependencies, multi-user):
      # an early DefaultDependencies=no unit ordered Before=sysinit.target
      # perturbs the pre-network dependency graph that cloud-init's Network
      # Stage lives in, and systemd resolved that by dropping
      # cloud-init.service - which silently skipped user/SSH-key creation on
      # Debian-family clones. Ordering Before=ssh.service is sufficient to
      # guarantee host keys exist before sshd serves.
      After=systemd-random-seed.service
      Before=ssh.service sshd.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/ssh-keygen -A
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Enable SSH host key regeneration guard
  ansible.builtin.systemd:
    name: ndb-ssh-hostkeys-ensure.service
    enabled: true
    daemon_reload: true
  become: true
